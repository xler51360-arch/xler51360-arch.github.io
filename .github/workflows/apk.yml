name: APK Mes heures

on:
  push:
    paths: ['mes-heures/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature (créée une seule fois, réutilisée ensuite)
        run: |
          if [ ! -f android/mesheures.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore android/mesheures.p12 -storepass mesheures -keypass mesheures \
              -alias mesheures -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mes heures, O=Leriche, C=FR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android/mesheures.p12
            git commit -m "Clé de signature de l'APK [skip ci]"
            git push
          fi

      - name: Copier l'application web dans l'APK
        run: |
          A=android/app/src/main/assets
          mkdir -p "$A"
          cp mes-heures/index.html mes-heures/icon.svg android/android.js "$A/"
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o "$A/jspdf.umd.min.js"
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#' "$A/index.html"
          sed -i 's#</body>#<script src="android.js"></script>\n</body>#' "$A/index.html"
          grep -q 'android.js' "$A/index.html"

      - name: Construire l'APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk mes-heures.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mes heures v${{ github.run_number }}
          body: Application Android de pointage. Télécharger mes-heures.apk ci-dessous.
          files: mes-heures.apk
          make_latest: true
